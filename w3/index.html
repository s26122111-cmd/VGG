<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水藍系 - 自定義迷因產生器</title>

    <!-- 引入 Tailwind CSS 提供質感排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts (Montserrat & Noto Sans TC) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
    <!-- 引入 FontAwesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 html2canvas 庫用於圖片下載截圖 (避開 CORS 限制) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        // 設定 Tailwind CSS 水藍色系主題色彩
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        aqua: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    },
                    fontFamily: {
                        meme: ['Montserrat', 'Noto Sans TC', 'Impact', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* 迷因文字的經典黑邊描邊效果 (使用強烈的 text-shadow) */
        .meme-text-stroke {
            color: white;
            font-family: 'Montserrat', 'Noto Sans TC', 'Impact', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow:
                3px 3px 0 #000,
               -3px 3px 0 #000,
                3px -3px 0 #000,
               -3px -3px 0 #000,
                0px 3px 0 #000,
                0px -3px 0 #000,
                3px 0px 0 #000,
               -3px 0px 0 #000,
                2px 2px 5px rgba(0,0,0,0.8);
            letter-spacing: 1px;
            word-break: break-word;
            line-height: 1.2;
        }

        /* 滾動條美化 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f0f9ff;
        }
        ::-webkit-scrollbar-thumb {
            background: #38bdf8;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #0284c7;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-sky-50 via-cyan-50 to-blue-100 min-h-screen text-slate-800 flex flex-col font-sans">

    <!-- 頂部導覽頁首 -->
    <header class="bg-white/80 backdrop-blur-md border-b border-aqua-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-aqua-500 to-cyan-400 p-2.5 rounded-2xl shadow-lg shadow-aqua-500/20 text-white">
                    <i class="fa-solid font-black fa-face-laugh-squint text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold bg-gradient-to-r from-aqua-600 to-cyan-500 bg-clip-text text-transparent">
                        自定義迷因產生器
                    </h1>
                    <p class="text-xs text-slate-500 hidden sm:block">輕鬆製作並分享你的專屬迷因梗圖</p>
                </div>
            </div>
            <a href="https://github.com" target="_blank" class="text-xs bg-aqua-100 hover:bg-aqua-200 text-aqua-700 px-3 py-1.5 rounded-full transition flex items-center gap-1 font-medium">
                <i class="fa-brands fa-github"></i> Meme Maker
            </a>
        </div>
    </header>

    <!-- 主要內容區域：響應式雙欄架構 -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start">
            
            <!-- 【控制面板區】(手機上會在上方，電腦版在左側 5 欄) -->
            <section class="lg:col-span-5 bg-white/90 backdrop-blur-sm p-5 sm:p-6 rounded-3xl shadow-xl border border-aqua-100 flex flex-col gap-6">
                
                <!-- 1. 圖片來源區 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-image text-aqua-500"></i> 第一步：選擇梗圖底圖
                    </label>

                    <!-- 本地檔案上傳 (解決 CORS 跨域下載問題的關鍵) -->
                    <div class="mb-3">
                        <label for="imageLoader" class="flex flex-col items-center justify-center w-full h-24 border-2 border-dashed border-aqua-300 rounded-2xl cursor-pointer bg-aqua-50/50 hover:bg-aqua-100/50 transition border-hover group">
                            <div class="flex flex-col items-center justify-center pt-2 pb-2">
                                <i class="fa-solid fa-cloud-arrow-up text-2xl text-aqua-500 group-hover:scale-110 transition-transform"></i>
                                <p class="text-xs font-semibold text-slate-600 mt-1">上傳電腦/手機圖片</p>
                                <p class="text-[10px] text-slate-400">支援 JPG, PNG, WEBP</p>
                            </div>
                            <input id="imageLoader" type="file" accept="image/*" class="hidden" />
                        </label>
                    </div>

                    <!-- 快速選取預設圖庫 -->
                    <div>
                        <span class="text-xs font-medium text-slate-500 mb-2 block">或使用內建經典梗圖：</span>
                        <div class="grid grid-cols-4 gap-2" id="presetContainer">
                            <!-- 預設圖片將由 JS 動態產生或點擊發揮效果 -->
                        </div>
                    </div>
                </div>

                <hr class="border-slate-100">

                <!-- 2. 文字編輯區 -->
                <div class="space-y-4">
                    <label class="block text-sm font-bold text-slate-700 flex items-center gap-2">
                        <i class="fa-solid fa-font text-aqua-500"></i> 第二步：輸入迷因文字
                    </label>
                    
                    <div>
                        <label class="text-xs font-semibold text-slate-600 mb-1 block">上方文字 (Top Text)</label>
                        <input type="text" id="topTextInput" value="當你寫的程式碼" placeholder="請輸入上方文字..." 
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-aqua-400 focus:border-transparent outline-none transition text-sm bg-slate-50 focus:bg-white">
                    </div>

                    <div>
                        <label class="text-xs font-semibold text-slate-600 mb-1 block">下方文字 (Bottom Text)</label>
                        <input type="text" id="bottomTextInput" value="第一次就直接 Run 成功" placeholder="請輸入下方文字..." 
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-aqua-400 focus:border-transparent outline-none transition text-sm bg-slate-50 focus:bg-white">
                    </div>
                </div>

                <hr class="border-slate-100">

                <!-- 3. 樣式與位置微調區 (滑桿 Controls) -->
                <div class="space-y-4">
                    <label class="block text-sm font-bold text-slate-700 flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-aqua-500"></i> 第三步：調整字體與位置
                    </label>

                    <!-- 全局字體大小滑桿 -->
                    <div>
                        <div class="flex justify-between text-xs font-medium text-slate-600 mb-1">
                            <span>字體大小 (Font Size)</span>
                            <span id="fontSizeVal" class="text-aqua-600 font-bold">36px</span>
                        </div>
                        <input type="range" id="fontSizeSlider" min="16" max="72" value="36" 
                            class="w-full h-2 bg-aqua-100 rounded-lg appearance-none cursor-pointer accent-aqua-500">
                    </div>

                    <!-- 上方文字垂直位置滑桿 -->
                    <div>
                        <div class="flex justify-between text-xs font-medium text-slate-600 mb-1">
                            <span>上方文字位置 (Top Position)</span>
                            <span id="topPosVal" class="text-aqua-600 font-bold">5%</span>
                        </div>
                        <input type="range" id="topPosSlider" min="0" max="45" value="5" 
                            class="w-full h-2 bg-aqua-100 rounded-lg appearance-none cursor-pointer accent-aqua-500">
                    </div>

                    <!-- 下方文字垂直位置滑桿 -->
                    <div>
                        <div class="flex justify-between text-xs font-medium text-slate-600 mb-1">
                            <span>下方文字位置 (Bottom Position)</span>
                            <span id="bottomPosVal" class="text-aqua-600 font-bold">5%</span>
                        </div>
                        <input type="range" id="bottomPosSlider" min="0" max="45" value="5" 
                            class="w-full h-2 bg-aqua-100 rounded-lg appearance-none cursor-pointer accent-aqua-500">
                    </div>
                </div>

                <!-- 4. 下載按鈕 -->
                <div class="pt-2">
                    <button id="downloadBtn" class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-aqua-500 to-cyan-500 hover:from-aqua-600 hover:to-cyan-600 text-white font-bold text-base shadow-lg shadow-aqua-500/30 hover:shadow-aqua-500/50 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-download"></i> 下載我的迷因 (my-meme.png)
                    </button>
                </div>

            </section>


            <!-- 【迷因預覽區】(手機上在下方，電腦版在右側 7 欄) -->
            <section class="lg:col-span-7 flex flex-col items-center justify-center">
                <div class="w-full bg-white/90 backdrop-blur-sm p-4 sm:p-6 rounded-3xl shadow-xl border border-aqua-100 flex flex-col items-center">
                    
                    <div class="w-full flex items-center justify-between mb-3 px-2">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1">
                            <i class="fa-solid fa-eye text-aqua-500"></i> 即時預覽畫面
                        </span>
                        <span class="text-xs bg-emerald-100 text-emerald-700 px-2.5 py-0.5 rounded-full font-medium">
                            Ready
                        </span>
                    </div>

                    <!-- 截圖目標區域 (#memeContainer)：包含了底圖與兩層文字 -->
                    <div id="memeContainer" class="relative w-full max-w-[600px] bg-slate-900 rounded-2xl overflow-hidden shadow-md flex items-center justify-center select-none min-h-[300px]">
                        
                        <!-- 迷因底圖 -->
                        <img id="memeImage" src="" alt="Meme Preview" class="w-full h-auto object-contain block max-h-[70vh]">
                        
                        <!-- 上方文字圖層 -->
                        <div id="topTextDisplay" class="absolute left-0 right-0 px-4 text-center meme-text-stroke pointer-events-none uppercase">
                            當你寫的程式碼
                        </div>

                        <!-- 下方文字圖層 -->
                        <div id="bottomTextDisplay" class="absolute left-0 right-0 px-4 text-center meme-text-stroke pointer-events-none uppercase">
                            第一次就直接 Run 成功
                        </div>

                        <!-- 載入中遮罩 -->
                        <div id="loadingOverlay" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center text-white hidden">
                            <div class="flex flex-col items-center gap-2">
                                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-aqua-400"></i>
                                <span class="text-sm font-medium">正在生成圖片...</span>
                            </div>
                        </div>
                    </div>

                    <p class="text-xs text-slate-400 mt-3 text-center">
                        💡 提示：微調文字大小與位置滑桿，即可獲得最佳梗圖效果。
                    </p>
                </div>
            </section>

        </div>
    </main>

    <footer class="mt-auto py-4 text-center text-xs text-slate-400 border-t border-slate-200/50">
        Water Blue Meme Generator &copy; 2026 - 打造高質感迷因創作體驗
    </footer>

    <script>
        /**
         * 程式碼邏輯說明 (適合非本科學生閱讀)：
         * 1. 取得 DOM 元素：把 HTML 中的輸入框、圖片、滑桿抓到 JavaScript 變數中。
         * 2. 註冊監聽器 (Event Listener)：當使用者打字或滑動滑桿時，即時更新預覽區。
         * 3. 圖片讀取 (FileReader)：用來把使用者選擇的電腦圖片變成網頁可直接顯示的 Data URL。
         * 4. 下載功能 (html2canvas)：將 HTML 區塊轉為 Canvas 並導出為 PNG 圖檔。
         */

        // --- 預設圖庫資料 (使用 SVG Data URI 免去外部網絡請求失敗風險) ---
        const presetMemes = [
            { name: "驚訝貓貓", url: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600&auto=format&fit=crop&q=80" },
            { name: "思考哲學", url: "https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=600&auto=format&fit=crop&q=80" },
            { name: "自信柴柴", url: "https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?w=600&auto=format&fit=crop&q=80" },
            { name: "酷炫狗狗", url: "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=600&auto=format&fit=crop&q=80" }
        ];

        // --- 取得 DOM 元素 ---
        const imageLoader = document.getElementById('imageLoader');
        const memeImage = document.getElementById('memeImage');
        const memeContainer = document.getElementById('memeContainer');
        const presetContainer = document.getElementById('presetContainer');

        const topTextInput = document.getElementById('topTextInput');
        const bottomTextInput = document.getElementById('bottomTextInput');
        const topTextDisplay = document.getElementById('topTextDisplay');
        const bottomTextDisplay = document.getElementById('bottomTextDisplay');

        const fontSizeSlider = document.getElementById('fontSizeSlider');
        const topPosSlider = document.getElementById('topPosSlider');
        const bottomPosSlider = document.getElementById('bottomPosSlider');

        const fontSizeVal = document.getElementById('fontSizeVal');
        const topPosVal = document.getElementById('topPosVal');
        const bottomPosVal = document.getElementById('bottomPosVal');

        const downloadBtn = document.getElementById('downloadBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');

        // --- 初始化頁面 ---
        window.addEventListener('DOMContentLoaded', () => {
            initPresets();
            // 預設載入第一張預設圖片
            setMemeImage(presetMemes[0].url);
            updateStyles();
        });

        // 動態產生預設圖片小縮圖
        function initPresets() {
            presetContainer.innerHTML = '';
            presetMemes.forEach((meme, index) => {
                const imgBtn = document.createElement('button');
                imgBtn.type = 'button';
                imgBtn.className = 'relative rounded-xl overflow-hidden border-2 border-transparent hover:border-aqua-500 focus:border-aqua-500 transition aspect-square group bg-slate-100';
                imgBtn.innerHTML = `
                    <img src="${meme.url}" alt="${meme.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-200">
                `;
                imgBtn.addEventListener('click', () => setMemeImage(meme.url));
                presetContainer.appendChild(imgBtn);
            });
        }

        // 設定迷因底圖 (處理 crossOrigin 避免 html2canvas 被污染)
        function setMemeImage(url) {
            memeImage.crossOrigin = "anonymous";
            memeImage.src = url;
        }

        // --- 本地圖片上傳邏輯 (FileReader) ---
        // 使用 FileReader 讀取本地圖片檔案，轉為 base64 字串，這樣 html2canvas 下載時完全不會發生 CORS 跨域錯誤
        imageLoader.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            
            // 當檔案讀取完成時觸發
            reader.onload = function(event) {
                setMemeImage(event.target.result);
            };

            // 以 DataURL (base64) 格式讀取圖檔
            reader.readAsDataURL(file);
        });

        // --- 文字即時更新監聽器 ---
        topTextInput.addEventListener('input', () => {
            topTextDisplay.textContent = topTextInput.value || '';
        });

        bottomTextInput.addEventListener('input', () => {
            bottomTextDisplay.textContent = bottomTextInput.value || '';
        });

        // --- 滑桿數值即時更新邏輯 ---
        function updateStyles() {
            const fontSize = fontSizeSlider.value;
            const topPos = topPosSlider.value;
            const bottomPos = bottomPosSlider.value;

            // 更新顯示字體大小
            fontSizeVal.textContent = `${fontSize}px`;
            topTextDisplay.style.fontSize = `${fontSize}px`;
            bottomTextDisplay.style.fontSize = `${fontSize}px`;

            // 更新上方文字位置 (top)
            topPosVal.textContent = `${topPos}%`;
            topTextDisplay.style.top = `${topPos}%`;

            // 更新下方文字位置 (bottom)
            bottomPosVal.textContent = `${bottomPos}%`;
            bottomTextDisplay.style.bottom = `${bottomPos}%`;
        }

        fontSizeSlider.addEventListener('input', updateStyles);
        topPosSlider.addEventListener('input', updateStyles);
        bottomPosSlider.addEventListener('input', updateStyles);

        // --- 下載圖檔功能 (使用 html2canvas) ---
        downloadBtn.addEventListener('click', async () => {
            try {
                // 顯示載入動畫
                loadingOverlay.classList.remove('hidden');

                // 設定 html2canvas 選項
                const options = {
                    scale: 2, // 提升輸出畫質 (2倍解析度)
                    useCORS: true, // 允許跨域圖片渲染
                    allowTaint: true,
                    backgroundColor: null
                };

                // 將 #memeContainer HTML 元素截圖轉換成 Canvas
                const canvas = await html2canvas(memeContainer, options);

                // 將 Canvas 轉成圖片 Data URL
                const imageUrl = canvas.toDataURL("image/png");

                // 建立隱藏的 <a> 標籤觸發瀏覽器下載
                const downloadLink = document.createElement('a');
                downloadLink.href = imageUrl;
                downloadLink.download = 'my-meme.png'; // 預設檔名
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);

            } catch (error) {
                console.error("生成迷因圖片失敗:", error);
                alert("生成圖片失敗，請嘗試使用本地上傳圖片後重試！");
            } finally {
                // 隱藏載入動畫
                loadingOverlay.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
