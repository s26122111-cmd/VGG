<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板</title>

  <!-- Google Fonts: 導入適合中文與質感的字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       1. 全局變數與基礎設定 (方便後續修改顏色)
       ========================================================= */
    :root {
      /* 【顏色設定專區】 */
      --bg-color: #fffdf5;          /* 網頁主背景色 (極淺暖黃白) */
      --card-bg: #ffffff;          /* 卡片背景色 (純白) */
      --primary-yellow: #fbc02d;   /* 主視覺黃色 (活力太陽黃) */
      --accent-yellow: #fff59d;    /* 輔助亮黃色 (柔和黃) */
      --glow-color: rgba(251, 192, 45, 0.6); /* 輪播發光顏色 (黃色半透明) */
      
      --text-main: #424242;        /* 主要文字顏色 (深灰，比純黑更柔和) */
      --text-muted: #8d8d8d;       /* 次要/時間文字顏色 */
      --border-color: #fff176;     /* 一般卡片邊框色 */

      /* 動畫速度 */
      --transition-speed: 0.5s;    /* 卡片切換焦點時的平滑過渡時間 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 40px 20px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: #f57f17; /* 標題深黃色 */
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* =========================================================
       2. 酷炫 Loading 動畫樣式
       ========================================================= */
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 0;
    }

    .pulse-loader {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .pulse-loader div {
      width: 18px;
      height: 18px;
      background-color: var(--primary-yellow);
      border-radius: 50%;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .pulse-loader div:nth-child(2) { animation-delay: 0.2s; }
    .pulse-loader div:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% {
        transform: scale(0.6);
        opacity: 0.4;
      }
      40% {
        transform: scale(1.2);
        opacity: 1;
        box-shadow: 0 0 12px var(--primary-yellow);
      }
    }

    .loading-text {
      font-size: 1.2rem;
      font-weight: 600;
      color: #f57f17;
      letter-spacing: 1px;
    }

    /* =========================================================
       3. 瀑布流排版 (Masonry Layout)
       ========================================================= */
    .masonry-grid {
      /* 使用 CSS Columns 實現瀑布流 */
      column-count: 3;            /* 預設大螢幕顯示 3 欄 */
      column-gap: 24px;
      display: none;              /* 載入完成前隱藏 */
    }

    /* 響應式調整欄數 */
    @media (max-width: 900px) {
      .masonry-grid { column-count: 2; }
    }
    @media (max-width: 600px) {
      .masonry-grid { column-count: 1; }
    }

    /* =========================================================
       4. 卡片基礎與輪播特效樣式
       ========================================================= */
    .card {
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      break-inside: avoid;        /* 防止卡片在欄位切斷處被裁切 */
      box-shadow: 0 4px 15px rgba(251, 192, 45, 0.08);
      
      /* 動畫平滑過渡屬性 */
      transition: transform var(--transition-speed) ease,
                  box-shadow var(--transition-speed) ease,
                  filter var(--transition-speed) ease,
                  opacity var(--transition-speed) ease,
                  border-color var(--transition-speed) ease;
      
      position: relative;
      cursor: pointer;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 2px dashed #fff9c4;
      padding-bottom: 8px;
    }

    .card-name {
      font-weight: 700;
      font-size: 1.1rem;
      color: #e65100; /* 姓名強調色 (暖橘黃) */
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-name::before {
      content: "💬";
      font-size: 0.9rem;
    }

    .card-time {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .card-message {
      font-size: 0.98rem;
      line-height: 1.6;
      color: var(--text-main);
      white-space: pre-wrap;     /* 保留留言內容中的換行 */
      word-break: break-word;
    }

    /* 
       【輪播重點特效 1】：被焦點選中的卡片高亮樣式
    */
    .card.highlight {
      transform: scale(1.08);    /* 放大 1.08 倍 */
      border-color: var(--primary-yellow);
      box-shadow: 0 10px 30px var(--glow-color), 0 0 15px var(--accent-yellow);
      filter: blur(0px) brightness(1.05);
      opacity: 1;
      z-index: 10;               /* 確保放大時壓在其他卡片上方 */
    }

    /* 
       【輪播重點特效 2】：當有卡片被選中時，非焦點卡片變暗、變模糊
    */
    .masonry-grid.has-highlight .card:not(.highlight) {
      filter: blur(2px) brightness(0.85); /* 輕微模糊並調暗 */
      opacity: 0.6;                        /* 提高透明度 */
      transform: scale(0.96);              /* 微微縮小 */
    }
  </style>
</head>
<body>

  <header>
    <h1>✨ 朋友對我的動態留言板 ✨</h1>
    <p>溫馨黃白展覽館・輪播呈現來自朋友的悄悄話</p>
  </header>

  <div class="container">
    <!-- 1. 載入中動畫區塊 -->
    <div id="loading-container">
      <div class="pulse-loader">
        <div></div>
        <div></div>
        <div></div>
      </div>
      <div class="loading-text">讀取留言中...</div>
    </div>

    <!-- 2. 留言卡片瀑布流牆 -->
    <div id="masonry-grid" class="masonry-grid"></div>
  </div>

  <script>
    /* =========================================================
       【參數設定區】
       ========================================================= */
    // Google 試算表發佈的 CSV 網址
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR7hQ1fi_1JCackidWu2wM-u2z-15oCshgqzC-GWWeAsJqDSiotEnV2zXhy6Jm-Z8cNWXljUHM0ekmK/pub?output=csv';
    
    // 【輪播秒數設定】這裡可以修改輪播切換的時間，目前預設為 3000毫秒 (3秒)
    const ROTATE_INTERVAL_MS = 3000; 

    // 全局變數
    let messages = [];      // 儲存解析後的留言資料
    let currentIndex = -1;  // 當前高亮的卡片索引
    let rotateTimer = null; // 輪播計時器

    /* =========================================================
       1. CSV 解析器 (妥善處理留言內的逗號與引號)
       ========================================================= */
    function parseCSV(text) {
      const lines = [];
      // 使用正則表達式解析 CSV，能安全處理包含逗號與雙引號的欄位內容
      const re = /(?!\s*$)\s*(?:'([^']*)'\vert{}"([^"]*)"\vert{}([^,\r\n]*))\s*(?:,\vert{}$)/g;

      // 按行切割
      const rawLines = text.split(/\r\n|\n/);

      rawLines.forEach((lineText, index) => {
        if (!lineText.trim()) return; // 忽略空行
        
        const row = [];
        lineText.replace(re, (m, c1, c2, c3) => {
          if (c1 !== undefined) row.push(c1);
          else if (c2 !== undefined) row.push(c2);
          else if (c3 !== undefined) row.push(c3);
          return '';
        });

        // 忽略第一行 (標頭：時間戳記, 名字, 悄悄話)
        if (index > 0 && row.length >= 3) {
          lines.push({
            timestamp: row[0] ? row[0].trim() : '',
            name: row[1] ? row[1].trim() : '無名氏',
            message: row[2] ? row[2].trim() : ''
          });
        }
      });

      return lines;
    }

    /* =========================================================
       2. 資料讀取 (fetch API)
       ========================================================= */
    async function fetchMessages() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('網路回應不成功');
        
        const csvData = await response.text();
        messages = parseCSV(csvData);

        // 隱藏 Loading 動畫，顯示瀑布流容器
        document.getElementById('loading-container').style.display = 'none';
        const grid = document.getElementById('masonry-grid');
        grid.style.display = 'block';

        if (messages.length === 0) {
          grid.innerHTML = '<p style="text-align:center; width:100%;">目前還沒有任何留言喔！</p>';
          return;
        }

        // 動態繪製卡片
        renderCards(messages);

        // 啟動自動輪播特效
        startCarousel();

      } catch (error) {
        console.error('讀取 CSV 失敗:', error);
        document.getElementById('loading-container').innerHTML = `
          <div class="loading-text" style="color: #d32f2f;">載入留言失敗，請稍後重試。</div>
        `;
      }
    }

    /* =========================================================
       3. 動態生成卡片 DOM
       ========================================================= */
    function renderCards(dataList) {
      const grid = document.getElementById('masonry-grid');
      grid.innerHTML = ''; // 清空內容

      dataList.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = idx; // 註記索引方便存取

        // 組合卡片內部 HTML
        card.innerHTML = `
          <div class="card-header">
            <span class="card-name">${escapeHTML(item.name)}</span>
            <span class="card-time">${escapeHTML(item.timestamp)}</span>
          </div>
          <div class="card-message">${escapeHTML(item.message)}</div>
        `;

        // 點擊卡片時，也可以手動切換焦點至該卡片
        card.addEventListener('click', () => {
          highlightCard(idx);
          resetTimer(); // 重新計算 3 秒
        });

        grid.appendChild(card);
      });
    }

    /* =========================================================
       4. 隨時間輪播特效 (Highlight 邏輯)
       ========================================================= */
    function highlightCard(index) {
      const cards = document.querySelectorAll('.card');
      const grid = document.getElementById('masonry-grid');

      if (cards.length === 0) return;

      // 移除舊卡片的高亮
      cards.forEach(c => c.classList.remove('highlight'));

      // 設定當前高亮卡片
      currentIndex = index;
      const targetCard = cards[currentIndex];

      if (targetCard) {
        grid.classList.add('has-highlight'); // 讓其他卡片觸發暗化模糊樣式
        targetCard.classList.add('highlight');

        // 平滑滾動確保焦點卡片儘量在可視範圍內 (選配優化體驗)
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    // 切換至下一張卡片
    function nextCard() {
      if (messages.length === 0) return;
      const nextIdx = (currentIndex + 1) % messages.length;
      highlightCard(nextIdx);
    }

    // 開啟計時器
    function startCarousel() {
      // 載入後先高亮第一張
      highlightCard(0);
      
      // 設定固定時間間隔輪播 (依據 ROTATE_INTERVAL_MS 變數)
      rotateTimer = setInterval(nextCard, ROTATE_INTERVAL_MS);
    }

    // 重置計時器 (當使用者手動點擊卡片時觸發)
    function resetTimer() {
      if (rotateTimer) clearInterval(rotateTimer);
      rotateTimer = setInterval(nextCard, ROTATE_INTERVAL_MS);
    }

    /* =========================================================
       5. 輔助功能: XSS 防範 (字串轉義)
       ========================================================= */
    function escapeHTML(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 初始化執行
    window.addEventListener('DOMContentLoaded', fetchMessages);
  </script>
</body>
</html>
